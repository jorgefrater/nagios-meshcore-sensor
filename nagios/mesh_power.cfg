# ------------------------------------------------------------------
# mesh_power — sensor de voltaje de red por malla MeshCore (NOC)
# El daemon en el NOC expone el estado por HTTP (:5053).
# EJEMPLO: reemplazar 192.0.2.10 por la IP real del NOC.
# ------------------------------------------------------------------

define command {
    command_name    check_mesh_power
    command_line    /usr/local/nagios/libexec/check_mesh_power -u $ARG1$ -c $ARG2$ -w $ARG3$ -a $ARG4$
}

define host {
    use             linux-server
    host_name       ac_sitios
    alias           AC Sitios
    address         192.0.2.10
    _SENDTELEGRAM   1
}

# Un service por sitio sensor. ARG1=URL del estado · ARG2=crit (V) · ARG3=warn (V) · ARG4=max_age (s)
define service {
    use                     generic-service
    host_name               ac_sitios
    service_description     mesh_power Barranca
    check_command           check_mesh_power!http://192.0.2.10:5053/state/sitio1!80!100!900
    check_interval          2
    retry_interval          1
    max_check_attempts      2
    notification_period     24x7
    contact_groups          ac-admins1
    _SENDTELEGRAM           1
}
