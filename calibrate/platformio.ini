; Proyecto de calibración del ZMPT101B — Heltec WiFi LoRa 32 V3 (ESP32-S3)
; Uso: pio run -e heltec_v3 -t upload  (con el Heltec por USB)  → monitor serial
[env:heltec_v3]
platform = platformio/espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=0
  -DBOARD_HAS_PSRAM=0
